name: host

# Does it format correctly? Runs the test suite on the CPU and diffs both
# paths (FFMT_BUFFER_PATH=0 and =1, through libc printf) against {fmt}:
# compilers x opt levels under sanitizers, plain Ubuntu / macOS builds,
# -ffast-math, negative-compile tests, and the coverage gate.

on:
  push:
    branches: [main, omp_support]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  matrix:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: ${{ matrix.cxx }} ${{ matrix.opt }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        opt: [-O0, -O2]
    env:
      CXX: ${{ matrix.cxx }}
      HOST_OPT: ${{ matrix.opt }}
      # `-fno-sanitize=bool`: libstdc++'s std::basic_format_arg uses an
      # _Arg_value union with a `bool _M_bool` member (libstdc++-13
      # bits/format.h around line 2737/2780). `_S_get<bool>` returns a
      # reference to that member, and the union initializes through
      # `_M_none()` so the raw bytes are 0 — which UBSan flags as "load
      # of value 0, which is not a valid value for type 'bool'". The
      # load is in <format>, not in our header, so disable just the bool
      # check; the rest of UBSan stays active.
      EXTRA_CXXFLAGS: -fsanitize=address,undefined -fno-sanitize=bool
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
    steps:
      - uses: actions/checkout@v6
      - name: Show toolchain
        run: ${{ matrix.cxx }} --version
      - name: Build + run host tests
        run: make -j$(nproc) test-host
      - name: Build + run host tests under -ffast-math
        run: make test-fast-math
      - name: Run negative-compile tests
        run: make -j$(getconf _NPROCESSORS_ONLN) test-negative

  plain:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # No sanitizers, default toolchain of each OS: catches what only shows
    # up in a normal build (macOS: Apple clang + libc++ + GNU Make 3.81 —
    # e.g. the memfd_create and build/ target-clash breakages).
    name: plain ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
          - os: macos-latest
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
      - name: Show toolchain
        run: ${{ matrix.cxx }} --version && make --version | head -1
      - name: Build + run host tests
        run: make -j$(getconf _NPROCESSORS_ONLN) test-host
      - name: Build + run host tests under -ffast-math
        run: make test-fast-math
      - name: Run negative-compile tests
        run: make -j$(getconf _NPROCESSORS_ONLN) test-negative

  coverage:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: coverage non-regression
    runs-on: ubuntu-24.04
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the base branch for the comparison build.
          fetch-depth: 0
      - name: Install llvm + jq
        run: sudo apt-get update && sudo apt-get install -y llvm jq
      - name: Pick base ref
        id: base
        run: |
          # PR runs compare against the merge base. Pushes fall back to
          # comparing against origin/main so direct pushes are still gated.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi
      - name: Coverage on base
        run: |
          git worktree add ../base ${{ steps.base.outputs.ref }}
          # Run `make coverage` (exists in every revision since coverage was
          # added) just to produce the cov_* binaries; the union script
          # below runs and exports them itself, so it works on any rev.
          # `CXX=$CXX` on the command line is required: older revs used
          # `CXX := icpx`, which the env-supplied `CXX` doesn't override —
          # command-line assignments do.
          make -C ../base CXX=$CXX -j$(nproc) coverage
          # Coverage binary names have changed across revs (cov_dpc_all/
          # cov_acpp_all → cov_specifiers/cov_buffer). Glob and let the
          # workflow be name-agnostic. The script is this branch's copy, so
          # base and head are measured the same way.
          cd ../base
          mapfile -t BINS < <(find build -maxdepth 1 -type f -executable -name 'cov_*')
          python3 "$GITHUB_WORKSPACE/.github/scripts/coverage_union.py" \
            "$($CXX -print-prog-name=llvm-cov)" "$($CXX -print-prog-name=llvm-profdata)" \
            include/ffmt/base.hpp "${BINS[@]}" > "$GITHUB_WORKSPACE/base.json"
      - name: Coverage on this branch
        run: |
          make -j$(nproc) coverage
          mapfile -t BINS < <(find build -maxdepth 1 -type f -executable -name 'cov_*')
          python3 .github/scripts/coverage_union.py \
            "$($CXX -print-prog-name=llvm-cov)" "$($CXX -print-prog-name=llvm-profdata)" \
            include/ffmt/base.hpp "${BINS[@]}" > head.json
      - name: Compare
        run: |
          # Union over the coverage binaries (see coverage_union.py): a
          # region counts as covered if either path's build covers it.
          base=$(jq -r .percent base.json)
          head=$(jq -r .percent head.json)
          printf 'Regions coverage — base: %.4f%%  head: %.4f%%\n' "$base" "$head"
          # 0.01pp slack: identical builds occasionally wobble at the 5th
          # decimal (rounding when the region count differs by an
          # always-false `if constexpr` branch, etc.). A real regression
          # moves the number by much more than this.
          awk -v b="$base" -v h="$head" \
            'BEGIN { if (h+0 < b+0 - 0.01) { printf("FAIL: %.4f%% < base %.4f%% (drop)\n", h, b); exit 1 } }'
